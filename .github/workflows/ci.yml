name: CI — build check

# Validates that the esbuild bundle builds on every PR. Does NOT deploy.
# Deployment is handled separately by deploy.yml (push to main only).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build deps (esbuild)
        run: npm install
      - name: Build precompiled bundle
        run: npm run build
